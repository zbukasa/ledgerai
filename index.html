        .theme-earthy h1, .theme-earthy h2, .theme-earthy h3, .theme-earthy h4, .theme-earthy h5, .theme-earthy h6 {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .theme-earthy body {
            font-family: 'Inter', sans-serif !important;
            background-color: #F1E3D3;
        }

        .theme-paper body {
            font-family: 'Caveat', cursive !important;
            background-color: #fdfaf1;
            background-image: 
                linear-gradient(90deg, transparent 79px, #ff9999 79px, #ff9999 81px, transparent 81px),
                linear-gradient(#e5e5e5 0.1em, transparent 0.1em);
            background-size: 100% 100%, 100% 1.5rem;
            background-attachment: fixed;
            position: relative;
        }

        .theme-paper body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("https://www.transparenttextures.com/patterns/paper.png");
            opacity: 0.1;
            pointer-events: none;
            z-index: 9999;
        }

        .theme-paper h1, .theme-paper h2, .theme-paper h3, .theme-paper p, .theme-paper span, .theme-paper div, .theme-paper button, .theme-paper input, .theme-paper select, .theme-paper textarea {
            font-family: 'Caveat', cursive !important;
            font-weight: 500;
            font-size: 1.15rem;
        }

        .theme-paper h1 { font-size: 2.5rem !important; }
        .theme-paper h2 { font-size: 1.8rem !important; }
        .theme-paper h3 { font-size: 1.4rem !important; }
        .theme-paper .text-xs { font-size: 0.9rem !important; }
        .theme-paper .text-[10px] { font-size: 0.85rem !important; }

        .theme-paper .bg-secondary, 
        .theme-paper .bg-\[var\(--bg-secondary\)\],
        .theme-paper .bg-gradient-to-br {
            box-shadow: 3px 3px 10px rgba(0,0,0,0.05);
            border-radius: 4px !important;
            border: 1px solid #e0ddd0 !important;
            position: relative;
            overflow: visible !important;
            background-color: var(--bg-secondary) !important;
            background-image: radial-gradient(#f4f1e6 1px, transparent 1px) !important;
            background-size: 20px 20px !important;
        }

        .theme-paper .bg-white\/20, 
        .theme-paper .bg-white\/10,
        .theme-paper .bg-white\/5 {
            background-color: rgba(0, 0, 0, 0.05) !important;
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
        }

        /* Torn paper effect for cards */
        .theme-paper .bg-secondary::before,
        .theme-paper .bg-\[var\(--bg-secondary\)\]::before {
            content: "";
            position: absolute;
            top: -5px;
            left: 0;
            right: 0;
            height: 10px;
            background: linear-gradient(135deg, #fdfaf1 5px, transparent 0),
                        linear-gradient(-135deg, #fdfaf1 5px, transparent 0);
            background-size: 10px 10px;
            background-position: left top;
            z-index: 1;
        }

        .theme-paper nav {
            border-right: 2px solid #ff9999 !important;
            background-image: radial-gradient(#d1cfc5 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Spiral binder effect for nav */
        .theme-paper nav::after {
            content: "";
            position: absolute;
            top: 0;
            right: 5px;
            bottom: 0;
            width: 10px;
            background-image: radial-gradient(circle, #7a7a7a 3px, transparent 3px);
            background-size: 100% 30px;
            opacity: 0.3;
        }

        .theme-paper .rounded-3xl,
        .theme-paper .rounded-2xl {
            border-radius: 4px !important;
        }

        .theme-paper .rounded-xl {
            border-radius: 2px !important;
        }

        /* Fix More menu alignment on mobile - Position it relative to the bottom but high enough to clear everything */
        @media (max-width: 767px) {
            .theme-paper .absolute.bottom-24 {
                position: absolute !important;
                bottom: 200% !important; /* Position it significantly above the navigation bar */
                margin-bottom: 2rem !important; /* Extra gap to ensure it clears the footer */
                left: 50% !important;
                right: auto !important;
                top: auto !important;
                width: 90vw !important;
                max-width: 320px !important;
                transform: translateX(-50%) !important;
                max-height: 50vh !important;
                overflow-y: auto !important;
                z-index: 2000 !important;
                border-radius: 20px !important;
                background-color: #fefcf6 !important;
                padding: 1.5rem !important;
                padding-bottom: 3rem !important; /* Extra space for the last item */
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4) !important;
                border: 3px solid #e0ddd0 !important;
            }
            /* Remove torn paper effect for the menu specifically to avoid layout issues */
            .theme-paper .absolute.bottom-24::before {
                display: none !important;
            }
        }

        /* Make inputs look like they are written on the lines */
        .theme-paper input, .theme-paper select, .theme-paper textarea {
            background-color: transparent !important;
            border-bottom: 1px dashed #7a7a7a !important;
            border-radius: 0 !important;
            border-top: none !important;
            border-left: none !important;
            border-right: none !important;
        }

        .theme-paper .text-primary, .theme-paper .text-\[var\(--text-primary\)\] {
            text-shadow: 0.5px 0.5px 1px rgba(0,0,0,0.1);
        }

        .theme-paper ::-webkit-scrollbar {
            width: 8px;
        }
        .theme-paper ::-webkit-scrollbar-track {
            background: #fdfaf1;
        }
        .theme-paper ::-webkit-scrollbar-thumb {
            background: #d1cfc5;
            border-radius: 4px;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Default dark background for smooth loading */
        }
